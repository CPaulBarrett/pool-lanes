# Fetches fresh lane data and publishes the site to GitHub Pages.
# Runs every 30 minutes, whenever code is pushed to main, and on demand
# (Actions tab → "Update and publish" → "Run workflow").

name: Update and publish

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC; GitHub may run it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # needed to publish to GitHub Pages
  id-token: write   # needed to prove the deploy comes from this repo

# Never run two updates at once; a newer run replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch lane availability
        run: python3 scripts/fetch.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
